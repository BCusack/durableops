services:
  postgres:
    image: postgres:16-alpine
    container_name: durableops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: durableops
      POSTGRES_PASSWORD: durableops
      POSTGRES_DB: durableops
    ports:
      - "5432:5432"
    volumes:
      - durableops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durableops -d durableops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  durableops_pgdata:
